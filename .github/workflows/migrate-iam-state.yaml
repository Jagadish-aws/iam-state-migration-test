name: Migrate ECS IAM to Global IAM State

# Manual only. Moves the shared ECS IAM resources out of an app's ECS Terraform
# state into its global-iam state. Defaults to a dry run (nothing uploaded).

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment'
        required: true
        type: choice
        options:
          - test
          - qa
          - uat
          - prod

      app_short_name:
        description: 'App short name (e.g. mr-app1)'
        required: true
        type: string

      dry_run:
        description: 'Dry run (download and migrate locally, upload nothing)'
        required: true
        type: boolean
        default: true

jobs:
  Migrate-IAM-State:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.5.7'
          terraform_wrapper: false

      - name: Verify required tools
        run: |
          echo "Checking aws, terraform versions..."
          aws --version
          terraform version

      - name: Run IAM state migration
        env:
          INPUT_ENV: ${{ github.event.inputs.env }}
          INPUT_APP_SHORT_NAME: ${{ github.event.inputs.app_short_name }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          chmod +x scripts/migrate-iam-state.sh

          echo "Env: $INPUT_ENV"
          echo "App short name: $INPUT_APP_SHORT_NAME"
          echo "Dry run: $INPUT_DRY_RUN"

          if [ "$INPUT_DRY_RUN" = "true" ]; then
            bash scripts/migrate-iam.sh "$INPUT_ENV" "$INPUT_APP_SHORT_NAME"
          else
            bash scripts/migrate-iam.sh "$INPUT_ENV" "$INPUT_APP_SHORT_NAME" --apply
          fi
